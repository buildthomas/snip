name: macOS build

on:
  push:
    paths: ["mac/**", ".github/workflows/mac.yml"]
  pull_request:
    paths: ["mac/**", ".github/workflows/mac.yml"]

jobs:
  build:
    runs-on: macos-14
    defaults:
      run:
        working-directory: mac
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version && sw_vers && uname -m
      - name: Build (release)
        run: swift build -c release
      - name: Unit tests
        run: swift test
      - name: Package app bundle (no launch)
        run: SNIP_APP_DIR="$RUNNER_TEMP/apps" SNIP_NO_OPEN=1 ./install.sh
      - name: Inspect bundle
        run: |
          ls -la "$RUNNER_TEMP/apps/Snip.app/Contents" "$RUNNER_TEMP/apps/Snip.app/Contents/MacOS" "$RUNNER_TEMP/apps/Snip.app/Contents/Resources"
          plutil -lint "$RUNNER_TEMP/apps/Snip.app/Contents/Info.plist"
          codesign -dv "$RUNNER_TEMP/apps/Snip.app" 2>&1 || true
          "$RUNNER_TEMP/apps/Snip.app/Contents/MacOS/Snip" --version
